<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>プロセス管理No.1</title>

<!-- ===================================================================
     ★ ここだけ書き換えてください ★

     1行目の「ここにアプリのURL」を、いま使っているアプリのURLに変えます。
     （Apps Script の「デプロイを管理」に出ている
       https://script.google.com/macros/s/……/exec というURLです）

     例:
     let APP_URL = "https://script.google.com/macros/s/AKfycbx.../exec";
     =================================================================== -->
<script>
  let APP_URL = "ここにアプリのURL";

  // 開き方。ふつうは "frame" のままでOK。
  //   "frame" … アプリの画面をこのページの中に全画面で表示する（アドレスバーが消えてアプリっぽい）
  //   "jump"  … このページを開いたらアプリへ移動するだけ（合い言葉を毎回聞かれる場合はこちらに）
  const MODE = "frame";
</script>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="プロセス管理No.1">
<style>
  :root{ color-scheme: light dark; }
  html,body{margin:0;padding:0;height:100%;background:#ffffff;}
  @media (prefers-color-scheme: dark){ html,body{background:#14161b;} }
  #app{
    position:fixed; inset:0; width:100%; height:100%; border:0; display:block;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .help{
    box-sizing:border-box; max-width:640px; margin:0 auto; padding:32px 22px;
    font:15px/1.8 -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
         "Yu Gothic", "Segoe UI", Roboto, sans-serif;
    color:#1a1d23;
  }
  @media (prefers-color-scheme: dark){ .help{color:#eef0f3;} }
  .help h1{font-size:18px; margin:0 0 14px;}
  .help code{background:rgba(127,127,127,.16); padding:2px 6px; border-radius:5px; font-size:13px;}
  .help img{width:88px; height:88px; border-radius:20px; display:block; margin:0 0 18px;
            box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .help a{color:#3457d5;}
</style>
</head>
<body>
<script>
(function(){
  var ok = typeof APP_URL === "string"
        && APP_URL.indexOf("https://script.google.com/") === 0
        && APP_URL.indexOf("/exec") > 0;

  // ファイルに書いていない場合は、この端末に覚えさせる方法も使える。
  // （ファイルに書かなければ、アプリのURLがインターネット上に出ません）
  var saved = null;
  try{ saved = localStorage.getItem("crbp_app_url"); }catch(e){}
  if(!ok && saved && saved.indexOf("/exec") > 0){ APP_URL = saved; ok = true; }

  if(!ok){
    document.body.innerHTML =
      '<div class="help">'
      + '<img src="icon-192.png" alt="">'
      + '<h1>アプリのURLを教えてください</h1>'
      + '<p>いま使っているアプリのURL（<code>https://script.google.com/macros/s/……/exec</code>）を'
      + '下に貼って「保存」を押すと、次からはこのページを開くだけでアプリが開きます。'
      + 'URLはこの端末の中だけに覚えます。</p>'
      + '<p><input id="u" type="url" placeholder="https://script.google.com/macros/s/……/exec" '
      + 'style="width:100%;box-sizing:border-box;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:8px;">'
      + '<button id="s" style="margin-top:10px;padding:10px 20px;font-size:15px;border:0;border-radius:8px;'
      + 'background:#3457d5;color:#fff;font-weight:600;">保存</button>'
      + '<span id="m" style="margin-left:10px;color:#d64545;"></span></p>'
      + '<p style="margin-top:22px;font-size:13px;opacity:.75;">'
      + '※ 全員の端末で聞かれないようにしたい場合は、この <code>index.html</code> の上のほうにある'
      + '<code>const APP_URL = "ここにアプリのURL";</code> を書き換えてください'
      + '（そのかわり、URLがこのページを見た人に見える状態になります）。</p>'
      + '</div>';
    document.getElementById("s").addEventListener("click", function(){
      var v = (document.getElementById("u").value || "").trim();
      if(v.indexOf("https://script.google.com/") !== 0 || v.indexOf("/exec") < 0){
        document.getElementById("m").textContent = "URLの形が違うようです。";
        return;
      }
      try{ localStorage.setItem("crbp_app_url", v); }catch(e){}
      location.reload();
    });
    return;
  }

  if(MODE === "jump"){
    location.replace(APP_URL);
    return;
  }

  var f = document.createElement("iframe");
  f.id = "app";
  f.src = APP_URL;
  f.setAttribute("allow", "clipboard-write; fullscreen");
  f.setAttribute("title", "プロセス管理No.1");
  document.body.appendChild(f);

  // 枠の中に出ないときのために、直接開くための逃げ道を用意しておく
  setTimeout(function(){
    if(document.getElementById("fallback")) return;
    var a = document.createElement("a");
    a.id = "fallback";
    a.href = APP_URL;
    a.textContent = "開かないときはこちら";
    a.setAttribute("style",
      "position:fixed; left:50%; transform:translateX(-50%); bottom:calc(10px + env(safe-area-inset-bottom));"
      + "z-index:9; font:12px -apple-system,BlinkMacSystemFont,sans-serif; color:#3457d5;"
      + "background:rgba(255,255,255,.92); padding:5px 12px; border-radius:999px;"
      + "box-shadow:0 1px 5px rgba(0,0,0,.18); text-decoration:none;");
    document.body.appendChild(a);
    setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 12000);
  }, 6000);
})();
</script>
</body>
</html>
